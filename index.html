<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6F1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="منصة النحاس" />
    <link rel="icon" href="/favicon.ico?v=20260715-brand4" />
    <link rel="apple-touch-icon" href="/icons/alnahhas-app-180-v4.png" />
    <link rel="manifest" href="/manifest.json?v=20260715-brand4" />
    <title>منصة النحاس التعليمية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
    <style>
      /* first paint before the app loads: matches the v2 background so there is no white flash */
      html { background: #FAF6F1; }
      @media (prefers-color-scheme: dark) { html { background: #0F0B09; } }
      body { margin: 0; font-family: 'Readex Pro', 'Cairo', system-ui, sans-serif; }
    </style>
    <script>
      try { var p = JSON.parse(localStorage.getItem('nx-prefs-v1') || '{}'); var t = p.theme === 'dark' || (p.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; document.documentElement.dataset.theme = t; document.documentElement.style.background = t === 'dark' ? '#0F0B09' : '#FAF6F1'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
