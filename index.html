<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- لون المتصفح من فوق على الموبايل -->
    <meta name="theme-color" content="#d97706" />
    
    <title>منصة النحاس التعليمية</title>

    <!-- ربط ملف الـ Manifest (هنا شلنا الـ PUBLIC_URL عشان يشتغل مع Vite صح) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- تسجيل الـ Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
    
    <!-- 1. استدعاء مكتبة التصميم Tailwind مباشرة -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. استدعاء الخط العربي (Cairo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- 3. إعدادات الخط الأساسي -->
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background-color: #f8fafc;
      }
      /* تخصيص شريط التمرير */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #d97706; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #b45309; }
    </style>
  </head>
  <link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#d97706" />
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
