    <script>
      /* first paint: apply the saved skin + day/night before the app loads (map generated from scripts/v2/skins.source.mjs) */
      try { var S = {"cinema":["cinema","#F4F1EE","#0B0908"],"nahhas":["classic","#FAF6F1","#0F0B09"],"zumurrud":["geo","#F2F5F1","#07120F"],"mawj":["glass","#E9F2FB","#050E1B"],"shafaq":["aurora","#F6F4FF","#0A0716"],"daftar":["notebook","#FDFDFB","#18211D"],"jari":["brutal","#FFF9E8","#121212"],"graphite":["minimal","#F8F8F9","#09090B"],"marah":["playful","#FFF7F2","#160F0D"],"malaki":["royal","#F4F5F8","#080B18"],"zahri":["soft","#FCF6F8","#140C12"]}; var p = JSON.parse(localStorage.getItem('nx-prefs-v1') || '{}'); var k = p.skin || localStorage.getItem('nx-platform-skin') || 'cinema'; if (!S[k]) k = 'cinema'; var t = p.theme === 'dark' || (p.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; var d = document.documentElement; d.dataset.skin = k; d.dataset.flavor = S[k][0]; d.dataset.theme = t; d.style.background = S[k][t === 'dark' ? 2 : 1]; } catch (e) {}
