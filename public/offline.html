<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>منصة النحاس - بدون اتصال</title>
  <style>
    body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#0f172a;color:#fff;display:grid;place-items:center;min-height:100vh;text-align:center}
    .card{max-width:520px;background:#fff;color:#0f172a;border-radius:28px;padding:34px;box-shadow:0 30px 80px rgba(0,0,0,.3);border-top:8px solid #d97706}
    h1{margin:0 0 12px;font-size:28px}p{line-height:1.9;color:#475569}button{background:#d97706;color:#fff;border:0;border-radius:16px;padding:14px 26px;font-weight:800;cursor:pointer}
  </style>
</head>
<body><div class="card"><h1>لا يوجد اتصال بالإنترنت</h1><p>بعض أجزاء المنصة تحتاج اتصالًا. تأكد من الإنترنت ثم حاول مرة أخرى.</p><button onclick="location.reload()">إعادة المحاولة</button></div></body>
</html>
